        - paragraph [ref=f2e99]: Atuação como Desenvolvedor Full Stack Sênior, utilizando Laravel e Node.js no backend, e Vue.js e React no frontend. Desenvolvimento de extensões para Google Chrome utilizando Vue.js, com foco em performance e experiência do usuário. Responsável por refatorações estruturais de projetos, incluindo a migração de vue-cli-service para Vite e a padronização do código de JavaScript para TypeScript. Desenvolvimento de novas funcionalidades, promovendo melhorias contínuas na qualidade do código e na evolução do produto. Atuação ativa em code reviews no GitHub, garantindo boas práticas, padronização e qualidade técnica. Participação em reuniões com clientes, contribuindo com alinhamentos técnicos, levantamento de requisitos e definição de soluções.
